<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied | Maintenance Dashboard</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Inter, Arial, sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }
        main {
            width: min(520px, calc(100vw - 32px));
            border: 1px solid #dbe4ee;
            border-radius: 8px;
            background: #ffffff;
            box-shadow: 0 22px 48px rgba(15, 23, 42, 0.14);
            padding: 26px;
        }
        h1 { margin: 0 0 10px; font-size: 1.35rem; letter-spacing: 0; }
        p { margin: 0 0 18px; color: #475569; line-height: 1.5; }
        a, button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            border-radius: 7px;
            padding: 0 14px;
            font: inherit;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
        }
        a { background: #2563eb; color: #ffffff; }
        form { display: inline; margin-left: 8px; }
        button { border: 1px solid #cbd5e1; background: #ffffff; color: #334155; }
    </style>
</head>
<body>
    <main>
        <h1>Access denied</h1>
        <p>Your {{ role }} account does not have permission to open that page or API endpoint.</p>
        <a href="{{ home_url }}">Go to allowed page</a>
        <form action="/logout" method="post">
            <button type="submit">Logout</button>
        </form>
    </main>
</body>
</html>
